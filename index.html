<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mesa">
<meta name="theme-color" content="#0a0a0b">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Mesa</title>
<style>
:root{--bg:#0a0a0b;--card:#111114;--line:#26262b;--line2:#3a3a41;--fg:#f2f2f4;--dim:#7c7c86;--acc:#7cf5c6;--red:#ff5d6c;--cw:62px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;overflow:hidden;background:var(--bg);color:var(--fg);touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;
  font:400 15px/1.2 -apple-system,system-ui,"SF Pro Text",sans-serif;font-variant-numeric:tabular-nums}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line2);border-radius:14px;cursor:pointer;transition:transform .12s,opacity .2s,background .2s}
button:active{transform:scale(.96)}
button:disabled{opacity:.25;pointer-events:none}

header{display:flex;align-items:center;justify-content:space-between;height:60px;flex:none}
.tabs{display:flex;gap:18px}
.tabs button{border:0;border-radius:0;padding:8px 0;color:var(--dim);font-size:17px;letter-spacing:.02em;border-bottom:1px solid transparent}
.tabs button.on{color:var(--fg);border-color:var(--fg)}
.bank{display:flex;align-items:center;gap:10px}
#chips{font-size:17px;font-weight:500;min-width:2ch;text-align:right}
#chips::before{content:"";display:inline-block;width:9px;height:9px;border:1.5px solid var(--acc);border-radius:50%;margin-right:7px;vertical-align:1px}
#refill{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
#refill svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:1.6;stroke-linecap:round}
#refill.nudge{animation:nudge 1s ease 3;border-color:var(--acc)}
@keyframes nudge{50%{transform:scale(1.18);box-shadow:0 0 0 6px #7cf5c622}}

main{flex:1;position:relative;min-height:0}
.game{position:absolute;inset:0;display:none;flex-direction:column;justify-content:space-around;padding:8px 0}
.game.on{display:flex}
.seat{display:flex;flex-direction:column;align-items:center;gap:10px}
.who{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);height:16px}
.who b{color:var(--fg);font-weight:500;letter-spacing:.04em;margin-left:6px}
.hand{display:flex;justify-content:center;min-height:calc(var(--cw)*1.4)}
#bjD{--cw:76px}#bjP{--cw:104px}
#bj .hand .card+.card{margin-left:calc(var(--cw)*-.55)}
#bj .hand.many .card+.card{margin-left:calc(var(--cw)*-.7)}
#bj .card:not(:last-child)>svg{visibility:hidden}
#pk{container-type:inline-size}
#pk .hand{gap:8px}
#pkC{--cw:50px}#pkP{--cw:104px;gap:12px}
#pkB{--cw:min(64px,calc((100cqw - 32px)/5));margin-bottom:16px}
.slot{width:var(--cw);aspect-ratio:5/7;border:1px dashed var(--line);border-radius:9px;flex:none}
.msg{text-align:center;font-size:22px;font-weight:300;letter-spacing:.01em;min-height:28px;transition:color .3s}
.msg.win{color:var(--acc)}.msg.lose{color:var(--red)}
.sub{text-align:center;font-size:12px;color:var(--dim);letter-spacing:.06em;min-height:15px;margin-top:6px}

.card{width:var(--cw);aspect-ratio:5/7;border:1px solid var(--line2);border-radius:9px;background:var(--card);position:relative;
  display:grid;place-items:center;flex:none;animation:deal .32s cubic-bezier(.2,.8,.2,1) both;transition:transform .2s,opacity .2s,border-color .2s}
.card i{position:absolute;top:calc(var(--cw)*.07);left:calc(var(--cw)*.08);font-style:normal;font-size:calc(var(--cw)*.24);font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1}
.card i svg{width:calc(var(--cw)*.17);height:calc(var(--cw)*.17)}
.card svg{width:46%;height:46%;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linejoin:round}
.card>svg{margin:18% 0 0 14%}
.card.red{color:var(--red)}
.card.back{background:repeating-linear-gradient(135deg,var(--card) 0 7px,#1f1f24 7px 8px);border-color:var(--line)}
.card.back>*{display:none}
.card.hl{border-color:var(--acc)}
@keyframes deal{from{transform:translateY(-24px) scale(.9);opacity:0}}

footer{flex:none;display:flex;flex-direction:column;gap:12px;padding:8px 0 14px}
.bet{display:flex;align-items:center;justify-content:center;gap:22px}
.bet button{width:44px;height:44px;border-radius:50%;font-size:22px;font-weight:300}
.bet div{text-align:center;min-width:80px}
.bet small{display:block;font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.bet span{font-size:26px;font-weight:300}
.actions{display:flex;gap:10px;height:54px}
.actions button{flex:1;font-size:16px;letter-spacing:.02em}
.actions button.p{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500}

.modal{position:fixed;inset:0;background:#000000cc;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;z-index:9;animation:fade .2s}
.modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.sheet{display:flex;flex-direction:column;align-items:center;gap:22px}
#ring{width:260px;height:260px;touch-action:none;cursor:grab}
#ring circle{fill:none}
.track{stroke:var(--line);stroke-width:1}
.goal{stroke:var(--line2);stroke-width:1;stroke-dasharray:1 3}
.prog{stroke:var(--acc);stroke-width:3;stroke-linecap:round}
#knob line{stroke:var(--line2);stroke-width:1}
#knob .h{stroke:var(--fg);stroke-width:2}
#ringTxt{fill:var(--fg);font:300 40px -apple-system,system-ui,sans-serif;text-anchor:middle}
#ringSub{fill:var(--dim);font:400 10px -apple-system,system-ui,sans-serif;letter-spacing:.2em;text-anchor:middle}
.close{width:48px;height:48px;border-radius:50%;font-size:20px;font-weight:300}
.done #ring .prog{stroke-width:5;transition:stroke-width .3s}

/* long side <= 700px: iPhone SE / mini */
@media (orientation:portrait) and (max-height:700px),(orientation:landscape) and (max-width:700px){
  #bjD{--cw:64px}#bjP,#pkP{--cw:88px}#pkC{--cw:42px}.msg{font-size:19px}.actions{height:48px}}
/* phone turned sideways: counter-rotate so the app stays upright on the device */
body.rot{inset:auto;top:50%;left:50%;width:100vh;height:100vw;transform:translate(-50%,-50%) rotate(var(--r));
  padding:max(env(safe-area-inset-left),env(safe-area-inset-right),12px) 16px 12px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="s♠" viewBox="0 0 24 24"><path d="M12 2.5C18 7.5 20.5 10.5 20.5 13c0 2.3-1.8 3.8-3.8 3.8-1.7 0-3.5-1-4.7-2.8-1.2 1.8-3 2.8-4.7 2.8-2 0-3.8-1.5-3.8-3.8 0-2.5 2.5-5.5 8.5-10.5zM12 14l-2.3 7.5h4.6z"/></symbol>
  <symbol id="s♥" viewBox="0 0 24 24"><path d="M12 21C5 15.5 2.5 12 2.5 8.5c0-3 2.3-5 4.8-5 2 0 3.7 1.2 4.7 3 1-1.8 2.7-3 4.7-3 2.5 0 4.8 2 4.8 5 0 3.5-2.5 7-9.5 12.5z"/></symbol>
  <symbol id="s♦" viewBox="0 0 24 24"><path d="M12 2.5l7.5 9.5-7.5 9.5L4.5 12z"/></symbol>
  <symbol id="s♣" viewBox="0 0 24 24"><path d="M8.46 9.45A4.2 4.2 0 1 1 15.54 9.45 4.2 4.2 0 1 1 12 13.6 4.2 4.2 0 1 1 8.46 9.45zM12 13.6l-2.3 7.9h4.6z"/></symbol>
</svg>

<header>
  <nav class="tabs"><button data-tab="bj" class="on">Blackjack</button><button data-tab="pk">Póker</button></nav>
  <div class="bank"><span id="chips">0</span>
    <button id="refill" aria-label="Recargar fichas"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5"/></svg></button>
  </div>
</header>

<main>
  <section class="game on" id="bj">
    <div class="seat"><div class="who">Casa<b id="bjDT"></b></div><div class="hand" id="bjD"></div></div>
    <div><div class="msg" id="bjMsg"></div><div class="sub" id="bjSub"></div></div>
    <div class="seat"><div class="hand" id="bjP"></div><div class="who">Tú<b id="bjPT"></b></div></div>
  </section>
  <section class="game" id="pk">
    <div class="seat"><div class="who">CPU<b id="pkCT"></b></div><div class="hand" id="pkC"></div></div>
    <div><div class="hand" id="pkB"></div><div class="msg" id="pkMsg"></div><div class="sub" id="pkSub"></div></div>
    <div class="seat"><div class="hand" id="pkP"></div><div class="who">Tú<b id="pkPT"></b></div></div>
  </section>
</main>

<footer>
  <div class="bet"><button id="betDn" aria-label="Menos">−</button><div><small>Apuesta</small><span id="bet">10</span></div><button id="betUp" aria-label="Más">+</button></div>
  <div class="actions" id="actions"></div>
</footer>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <svg id="ring" viewBox="0 0 200 200">
      <circle class="track" cx="100" cy="100" r="80"/>
      <circle class="goal" cx="100" cy="100" r="90"/>
      <circle class="prog" id="prog" cx="100" cy="100" r="80" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 100 100)"/>
      <g id="knob" style="transform-origin:100px 100px"></g>
      <text id="ringTxt" x="100" y="108">0</text>
      <text id="ringSub" x="100" y="130">GIRA</text>
    </svg>
    <button class="close" id="close" aria-label="Cerrar">✕</button>
  </div>
</div>

<script>
// ---------- base ----------
const $ = id => document.getElementById(id);
const MAX = 100, STEPS = [5, 10, 25, 50, 100];
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };
const S = { chips: store.get('chips', MAX), bet: store.get('bet', 10), tab: 'bj' };

// no zoom, no scroll
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// haptics: Android vibrate, iOS 18+ switch-toggle trick
function tick() {
  if (navigator.vibrate) return navigator.vibrate(8);
  const l = document.createElement('label'), i = document.createElement('input');
  i.type = 'checkbox'; i.setAttribute('switch', ''); l.style.display = 'none'; l.append(i);
  document.head.append(l); l.click(); l.remove();
}
const buzz = n => { for (let k = 0; k < n; k++) setTimeout(tick, k * 110) };

// chips counter
let shown = S.chips;
function setChips(v) {
  S.chips = v; store.set('chips', v);
  const from = shown, t0 = performance.now();
  (function f(t) { const p = Math.min(1, (t - t0) / 450); shown = Math.round(from + (v - from) * p); $('chips').textContent = shown; if (p < 1) requestAnimationFrame(f) })(t0);
}
setChips(S.chips);

// bet
const bet = () => Math.min(S.bet, S.chips);
function drawBet() { $('bet').textContent = bet() || S.bet }
function stepBet(d) {
  let i = STEPS.indexOf(S.bet); i = Math.max(0, Math.min(STEPS.length - 1, (i < 0 ? 1 : i) + d));
  S.bet = STEPS[i]; store.set('bet', S.bet); drawBet(); tick();
}
$('betDn').onclick = () => stepBet(-1);
$('betUp').onclick = () => stepBet(1);
function canPay(b) {
  if (b > 0 && S.chips >= b) return true;
  $('refill').classList.remove('nudge'); void $('refill').offsetWidth; $('refill').classList.add('nudge'); buzz(3);
  say(S.tab, 'Sin fichas', 'lose', 'recarga arriba ↗');
  return false;
}

// cards
const NAME = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' }, rn = r => NAME[r] || r;
function newDeck() {
  const d = []; for (const s of '♠♥♦♣') for (let r = 2; r <= 14; r++) d.push({ r, s });
  for (let i = d.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[d[i], d[j]] = [d[j], d[i]] }
  return d;
}
function cardEl(c, down, delay = 0) {
  const e = document.createElement('div');
  e.className = 'card' + (down ? ' back' : '') + ('♥♦'.includes(c.s) ? ' red' : '');
  const u = `<svg><use href="#s${c.s}"/></svg>`;
  e.innerHTML = `<i>${rn(c.r)}${u}</i>${u}`;
  e.style.animationDelay = delay + 'ms';
  c.el = e;
  return e;
}
function flip(e) { e.classList.remove('back'); e.style.animation = 'none'; e.animate([{ transform: 'rotateY(90deg)' }, { transform: 'none' }], 260) }
function say(g, txt, cls = '', sub = '') { const m = $(g + 'Msg'); m.textContent = txt; m.className = 'msg ' + cls; $(g + 'Sub').textContent = sub }

// footer actions for active tab
function actions(list) {
  const a = $('actions'); a.innerHTML = '';
  for (const [t, f, p, off] of list) { const b = document.createElement('button'); b.textContent = t; b.className = p ? 'p' : ''; b.disabled = !!off; b.onclick = () => { tick(); f() }; a.append(b) }
}
const ui = () => (S.tab === 'bj' ? BJ : PK).ui();
const lockBet = on => { $('betDn').disabled = $('betUp').disabled = on };

// ---------- blackjack ----------
const BJ = {
  phase: 'bet', d: [], P: [], D: [], b: 0,
  total(h) { let t = 0, a = 0; for (const c of h) { t += c.r === 14 ? (a++, 11) : Math.min(c.r, 10) } while (t > 21 && a--) t -= 10; return t },
  ui() {
    lockBet(this.phase !== 'bet'); drawBet();
    if (this.phase === 'play') actions([['Doblar', () => this.double(), 0, this.P.length > 2 || S.chips < this.b], ['Pedir', () => this.hit(), 1], ['Plantarse', () => this.stand(), 0]]);
    else if (this.phase === 'dealer') actions([['…', () => { }, 0, 1]]);
    else actions([['Repartir', () => this.deal(), 1]]);
  },
  add(who, down, delay) { const c = this.d.pop(); this[who].push(c); $('bj' + who).append(cardEl(c, down, delay)); $('bj' + who).classList.toggle('many', this[who].length > 5); return c },
  totals(showD) { $('bjPT').textContent = this.P.length ? this.total(this.P) : ''; $('bjDT').textContent = showD ? this.total(this.D) : this.D.length ? rn(this.D[0].r) === 'A' ? 'A' : this.total([this.D[0]]) : '' },
  deal() {
    const b = bet(); if (!canPay(b)) return;
    setChips(S.chips - b); this.b = b; this.d = newDeck(); this.P = []; this.D = [];
    $('bjP').innerHTML = $('bjD').innerHTML = ''; say('bj', '');
    this.add('P', 0, 0); this.add('D', 0, 120); this.add('P', 0, 240); this.add('D', 1, 360);
    this.phase = 'play'; this.totals(false);
    const p = this.total(this.P) === 21, d = this.total(this.D) === 21;
    if (p || d) { this.phase = 'dealer'; this.ui(); return setTimeout(() => this.finish(), 600) }
    say('bj', '¿Pides o te plantas?'); this.ui();
  },
  hit() {
    this.add('P', 0, 0); this.totals(false);
    const t = this.total(this.P);
    if (t > 21) return this.finish();
    if (t === 21) return this.stand();
    this.ui();
  },
  double() { setChips(S.chips - this.b); this.b *= 2; this.add('P', 0, 0); this.totals(false); this.total(this.P) > 21 ? this.finish() : this.stand() },
  stand() {
    this.phase = 'dealer'; this.ui();
    flip($('bjD').children[1]); this.totals(true);
    const step = () => {
      if (this.total(this.D) < 17) { this.add('D', 0, 0); this.totals(true); setTimeout(step, 520) }
      else this.finish();
    };
    setTimeout(step, 520);
  },
  finish() {
    const back = $('bjD').children[1]; if (back.classList.contains('back')) flip(back);
    this.totals(true);
    const p = this.total(this.P), d = this.total(this.D), b = this.b;
    const pBJ = p === 21 && this.P.length === 2, dBJ = d === 21 && this.D.length === 2;
    let win = 0, txt, cls;
    if (p > 21) [txt, cls] = ['Te pasaste', 'lose'];
    else if (pBJ && !dBJ) [win, txt, cls] = [b + Math.floor(b * 1.5), 'Blackjack', 'win'];
    else if (dBJ && !pBJ) [txt, cls] = ['Blackjack de la casa', 'lose'];
    else if (d > 21) [win, txt, cls] = [b * 2, 'La casa se pasó', 'win'];
    else if (p > d) [win, txt, cls] = [b * 2, 'Ganaste', 'win'];
    else if (p === d) [win, txt, cls] = [b, 'Empate', ''];
    else [txt, cls] = ['Gana la casa', 'lose'];
    setChips(S.chips + win);
    const net = win - b;
    say('bj', txt, cls, net > 0 ? `+${net} fichas` : net < 0 ? `${net} fichas` : 'recuperas tu apuesta');
    buzz(cls === 'win' ? 2 : 1);
    this.phase = 'bet'; if (S.tab === 'bj') this.ui();
  }
};

// ---------- Texas Hold'em (mano a mano, apuesta fija) ----------
const HN = ['Carta alta', 'Par', 'Doble par', 'Trío', 'Escalera', 'Color', 'Full', 'Póker', 'Escalera de color'];
function evalHand(h) {  // up to 5 cards
  const rs = h.map(c => c.r).sort((a, b) => b - a), cnt = {};
  rs.forEach(r => cnt[r] = (cnt[r] || 0) + 1);
  const g = Object.entries(cnt).map(([r, n]) => [n, +r]).sort((a, b) => b[0] - a[0] || b[1] - a[1]);
  const fl = h.length === 5 && h.every(c => c.s === h[0].s);
  let st = 0;
  if (g.length === 5) st = rs[0] - rs[4] === 4 ? rs[0] : rs.join() === '14,5,4,3,2' ? 5 : 0;
  const n2 = g[1]?.[0];
  const cat = st && fl ? 8 : g[0][0] === 4 ? 7 : g[0][0] === 3 && n2 === 2 ? 6 : fl ? 5 : st ? 4 : g[0][0] === 3 ? 3 : g[0][0] === 2 && n2 === 2 ? 2 : g[0][0] === 2 ? 1 : 0;
  const name = HN[cat] + ([0, 1, 3, 7].includes(cat) ? ' · ' + rn(g[0][1]) : '');
  return { cat, g, name, score: [cat, ...(st ? [st] : g.map(x => x[1]))], cards: h };
}
const cmp = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0 };
function best(cards) {  // best 5 of up to 7
  if (cards.length <= 5) return evalHand(cards);
  let b = null;
  for (let m = 0; m < 1 << cards.length; m++) {
    const h = cards.filter((_, i) => m >> i & 1);
    if (h.length !== 5) continue;
    const e = evalHand(h); if (!b || cmp(e.score, b.score) > 0) b = e;
  }
  return b;
}
// ponytail: rough 0..1 hand strength for the CPU; swap for Monte Carlo odds if it feels too easy
function strength(hole, board) {
  const [a, b] = hole.map(c => c.r).sort((x, y) => y - x);
  if (!board.length) return a === b ? .55 + a / 40 : (a + b) / 32 + (hole[0].s === hole[1].s ? .05 : 0);
  const me = best([...hole, ...board]);
  if (me.cat <= best(board).cat) return .15 + a / 70;  // only playing the board
  return [.2, .45 + me.g[0][1] / 50, .72, .8, .85, .88, .93, .97, 1][me.cat];
}

const STREET = ['Preflop', 'Flop', 'Turn', 'River'];
const PK = {
  phase: 'bet', d: [], P: [], C: [], B: [], pot: 0, inv: 0, b: 0, st: 0,
  ui() {
    lockBet(this.phase !== 'bet'); drawBet();
    if (this.phase === 'act') actions([['Pasar', () => this.check(), 0], [`Apostar +${this.b}`, () => this.raise(), 1, S.chips < this.b]]);
    else if (this.phase === 'facing') actions([['Retirarse', () => this.fold(), 0], [`Igualar +${this.b}`, () => this.call(), 1]]);
    else if (this.phase === 'wait') actions([['…', () => { }, 0, 1]]);
    else actions([['Repartir', () => this.deal(), 1]]);
  },
  names(showC) {
    $('pkPT').textContent = best([...this.P, ...this.B]).name;
    $('pkCT').textContent = showC ? best([...this.C, ...this.B]).name : '';
  },
  info(txt, cls = '') { say('pk', txt, cls, `${STREET[this.st]} · bote ${this.pot}`) },
  put(n) { setChips(S.chips - n); this.pot += n; this.inv += n },
  deal() {
    const b = bet(); if (!canPay(b)) return;
    this.b = b; this.pot = b; this.inv = 0; this.put(b); this.st = 0;  // both ante b
    this.d = newDeck(); this.P = [this.d.pop(), this.d.pop()]; this.C = [this.d.pop(), this.d.pop()]; this.B = [];
    $('pkP').replaceChildren(...this.P.map((c, i) => cardEl(c, 0, i * 140)));
    $('pkC').replaceChildren(...this.C.map((c, i) => cardEl(c, 1, 70 + i * 140)));
    $('pkB').replaceChildren(...[0, 1, 2, 3, 4].map(() => Object.assign(document.createElement('div'), { className: 'slot' })));
    this.names(false); this.act('Tu turno');
  },
  act(txt) { this.phase = 'act'; this.info(txt); this.ui() },
  cpu(fn) { this.phase = 'wait'; this.ui(); setTimeout(fn, 750) },
  check() {
    this.info('Pasas…');
    this.cpu(() => {
      const s = strength(this.C, this.B);
      if (S.chips >= this.b && Math.random() < (s > .7 ? .8 : .12)) {
        this.pot += this.b; this.phase = 'facing'; this.info(`CPU apuesta ${this.b}`); buzz(1); this.ui();
      } else this.next('CPU pasa');
    });
  },
  raise() {
    this.put(this.b); this.info('Apuestas…');
    this.cpu(() => {
      const s = strength(this.C, this.B);
      if (s > .4 || Math.random() < .25) { this.pot += this.b; this.next('CPU iguala') }
      else this.win('CPU se retira');
    });
  },
  call() { this.put(this.b); this.next('Igualas') },
  fold() { say('pk', 'Te retiraste', 'lose', `-${this.inv} fichas`); buzz(1); this.end() },
  win(txt) { setChips(S.chips + this.pot); say('pk', txt, 'win', `+${this.pot - this.inv} fichas`); buzz(2); this.end() },
  next(txt) {
    if (++this.st > 3) { this.st = 3; return this.show() }
    const n = this.st === 1 ? 3 : 1, slots = $('pkB').children;
    for (let k = 0; k < n; k++) { const c = this.d.pop(), i = this.B.push(c) - 1; slots[i].replaceWith(cardEl(c, 0, k * 120)) }
    tick(); this.names(false); this.act(txt);
  },
  show() {
    this.C.forEach(c => flip(c.el)); this.names(true);
    const me = best([...this.P, ...this.B]), op = best([...this.C, ...this.B]), r = cmp(me.score, op.score);
    const win = r > 0 ? this.pot : r === 0 ? this.pot / 2 : 0, net = win - this.inv;
    setChips(S.chips + win);
    say('pk', r > 0 ? 'Ganaste' : r < 0 ? 'Gana CPU' : 'Empate', r > 0 ? 'win' : r < 0 ? 'lose' : '', (net > 0 ? '+' : '') + net + ' fichas');
    if (r) (r > 0 ? me : op).cards.forEach(c => c.el.classList.add('hl'));
    buzz(r > 0 ? 2 : 1); this.end();
  },
  end() { this.phase = 'bet'; if (S.tab === 'pk') this.ui() }
};

// ---------- tabs ----------
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  if (S.tab === b.dataset.tab) return;
  S.tab = b.dataset.tab; tick();
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.game').forEach(g => g.classList.toggle('on', g.id === S.tab));
  ui();
});

// ---------- refill ring ----------
const knob = $('knob');
for (let a = 0; a < 360; a += 15) knob.insertAdjacentHTML('beforeend', `<line x1="100" y1="${a ? 26 : 14}" x2="100" y2="${a ? 32 : 40}" class="${a ? '' : 'h'}" transform="rotate(${a} 100 100)"/>`);
let spin = null;
function openRefill() {
  $('modal').hidden = false; $('modal').classList.remove('done'); tick();
  spin = { total: 0, last: null, ticks: 0, full: S.chips >= MAX };
  knob.style.transform = ''; $('prog').setAttribute('stroke-dasharray', '0 100');
  $('ringTxt').textContent = S.chips; $('ringSub').textContent = spin.full ? 'AL MÁXIMO' : 'GIRA 1 VUELTA';
}
const closeRefill = () => { $('modal').hidden = true; spin = null };
const ang = e => { const r = $('ring').getBoundingClientRect(); return Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2) * 180 / Math.PI };
$('ring').addEventListener('pointerdown', e => { if (!spin || spin.full) return; $('ring').setPointerCapture(e.pointerId); spin.last = ang(e); tick() });
$('ring').addEventListener('pointermove', e => {
  if (!spin || spin.last === null) return;
  const a = ang(e); let d = a - spin.last; d -= Math.round(d / 360) * 360; spin.last = a; spin.total += d;
  const deg = Math.min(360, Math.abs(spin.total));
  knob.style.transform = `rotate(${spin.total}deg)`;
  $('prog').setAttribute('stroke-dasharray', `${deg / 3.6} 100`);
  $('ringTxt').textContent = Math.round(S.chips + (MAX - S.chips) * deg / 360);
  const t = Math.floor(deg / 15); if (t !== spin.ticks) { spin.ticks = t; tick() }
  if (deg >= 360) {
    spin.last = null; $('modal').classList.add('done'); $('ringSub').textContent = 'RECARGADO';
    setChips(MAX); buzz(3); setTimeout(closeRefill, 700);
    if ((S.tab === 'bj' ? BJ : PK).phase === 'bet') say(S.tab, 'Recargado', 'win', `${MAX} fichas`);
  }
});
$('ring').addEventListener('pointerup', () => { if (spin) spin.last = null });
$('refill').onclick = () => { $('refill').classList.remove('nudge'); openRefill() };
$('close').onclick = () => { tick(); closeRefill() };
$('modal').onclick = e => { if (e.target === $('modal')) closeRefill() };

// ---------- keep portrait when the phone turns ----------
function orient() {
  const land = innerWidth > innerHeight;
  const a = typeof window.orientation === 'number' ? window.orientation : (screen.orientation?.angle === 270 ? -90 : 90);
  document.body.style.setProperty('--r', a === -90 ? '90deg' : '-90deg');
  document.body.classList.toggle('rot', land);
}
addEventListener('resize', orient); addEventListener('orientationchange', () => setTimeout(orient, 50)); orient();

// ---------- start ----------
say('bj', 'Elige tu apuesta', '', 'y reparte'); say('pk', 'Elige tu apuesta', '', 'y reparte');
ui();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
